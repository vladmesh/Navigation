name: Nightly Dr. Memory (Windows)

# Dr. Memory (утечки, неинициализированная память, выход за границы кучи)
# на автономных юнит-тестах парсеров. Падение запуска = красный прогон.
# Ложные срабатывания внутри Qt/системных DLL — в .github/drmemory.supp.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image"
        required: false
        default: "windows-2022"

jobs:
  drmemory:
    runs-on: ${{ github.event.inputs.runner || 'windows-2022' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtpositioning"
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build unit tests (debug)
        shell: cmd
        run: |
          mkdir build-tests && cd build-tests
          qmake ..\Test\unit\unit.pro CONFIG+=debug "QMAKE_CXXFLAGS+=/MP /FS" || exit /b 1
          nmake || exit /b 1

      - name: Deploy Qt next to the test exe
        shell: pwsh
        run: |
          windeployqt --debug --no-translations --no-compiler-runtime build-tests\debug\tst_parsers.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force build-tests\debug\platforms | Out-Null
          Copy-Item "$env:QT_ROOT_DIR\plugins\platforms\qoffscreend.dll" build-tests\debug\platforms\

      - name: Sanity run without Dr. Memory
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: build-tests\debug\tst_parsers.exe

      - name: Install Dr. Memory
        run: choco install drmemory -y --no-progress

      - name: Run under Dr. Memory
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $dr = Get-ChildItem "C:\Program Files (x86)\Dr. Memory\bin64\drmemory.exe","C:\Program Files\Dr. Memory\bin64\drmemory.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dr) { Write-Host "::error::drmemory.exe not found"; exit 1 }
          New-Item -ItemType Directory -Force drmemory-logs | Out-Null
          & $dr.FullName -batch -exit_code_if_errors 3 -suppress .github\drmemory.supp -logdir drmemory-logs -- build-tests\debug\tst_parsers.exe
          $rc = $LASTEXITCODE
          Get-ChildItem drmemory-logs -Recurse -Filter results.txt | ForEach-Object { Get-Content $_.FullName -TotalCount 200 }
          if ($rc -ne 0) { Write-Host "::error::Dr. Memory exit code $rc (3 = memory errors found, other = tool/test failure)"; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drmemory-logs
          path: drmemory-logs/
          if-no-files-found: ignore
          retention-days: 30
