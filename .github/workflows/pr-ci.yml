name: PR CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"
  # Модули по Ship.pro: network/core/gui/widgets входят в базу,
  # serialport, location, positioning — аддоны. core5compat из Ship.pro
  # убран, qt5compat оставлен в установке на случай старых веток.
  QT_MODULES: "qtserialport qtpositioning qtlocation qt5compat"

jobs:
  windows-msvc:
    name: Windows / MSVC build + unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build Ship (release, /W4 without /WX)
        shell: cmd
        run: |
          set MAKE=nmake
          mkdir build && cd build
          qmake ..\Ship.pro CONFIG+=release "QMAKE_CXXFLAGS_WARN_ON=/W4" "QMAKE_CXXFLAGS+=/MP" || exit /b 1
          %MAKE% || exit /b 1
          dir release\Ship.exe

      - name: Build unit tests
        shell: cmd
        run: |
          set MAKE=nmake
          mkdir build-tests && cd build-tests
          qmake ..\Test\unit\unit.pro CONFIG+=release "QMAKE_CXXFLAGS_WARN_ON=/W4" "QMAKE_CXXFLAGS+=/MP" || exit /b 1
          %MAKE% || exit /b 1

      - name: Run unit tests
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: build-tests\release\tst_parsers.exe -o -,txt -o tst_parsers.xml,junitxml

      - name: Build and run C1-C3 tests (tst_critical)
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set MAKE=nmake
          mkdir build-critical && cd build-critical
          qmake ..\Test\unit\critical\critical.pro CONFIG+=release "QMAKE_CXXFLAGS_WARN_ON=/W4" "QMAKE_CXXFLAGS+=/MP" || exit /b 1
          %MAKE% || exit /b 1
          release\tst_critical.exe -o -,txt -o ..\tst_critical.xml,junitxml

      - name: Build and run GridMath tests (tst_gridmath, ADR 0001 Task 01)
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set MAKE=nmake
          mkdir build-gridmath && cd build-gridmath
          qmake ..\Test\unit\gridmath\tst_gridmath.pro CONFIG+=release "QMAKE_CXXFLAGS_WARN_ON=/W4" "QMAKE_CXXFLAGS+=/MP" || exit /b 1
          %MAKE% || exit /b 1
          release\tst_gridmath.exe -o -,txt -o ..\tst_gridmath.xml,junitxml

      - name: Legacy tests (skipped)
        shell: bash
        run: |
          # Test/test_postprocessing, testppkparser, testitemsloading — это не
          # автотесты, а сценарии на полевых данных (SEG-Y, NMEA, PPK, JSON),
          # которых нет в репозитории. Пути переведены на NAV_TEST_DATA_DIR,
          # но без данных запускать нечего.
          echo "::notice title=Legacy tests skipped::Test/test_postprocessing, testppkparser, testitemsloading need field data (NAV_TEST_DATA_DIR), not in repo"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-windows
          path: |
            tst_parsers.xml
            tst_critical.xml
            tst_gridmath.xml
          if-no-files-found: ignore

  windows-mingw-smoke:
    name: Windows / MinGW 6.10.2 build + smoke e2e (deploy/win64-mingw)
    runs-on: windows-latest
    env:
      QT_MINGW_VERSION: "6.10.2"
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.10.2 MinGW + MinGW 13.1.0
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_MINGW_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          modules: ${{ env.QT_MODULES }}
          tools: tools_mingw1310
          cache: true

      - name: Toolchain info
        shell: pwsh
        run: |
          $mingw = Join-Path $env:RUNNER_WORKSPACE "Qt\Tools\mingw1310_64\bin"
          if (-not (Test-Path $mingw)) { $mingw = (Get-ChildItem -Recurse -Directory -Path (Join-Path $env:RUNNER_WORKSPACE "Qt\Tools") -Filter bin | Where-Object { Test-Path (Join-Path $_.FullName "g++.exe") } | Select-Object -First 1).FullName }
          "$mingw" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$mingw\g++.exe" --version
          qmake -query QT_VERSION

      - name: Runtime set matches the official Qt build
        shell: bash
        run: |
          QT_BIN="$(qmake -query QT_INSTALL_BINS)"; QT_PLUG="$(qmake -query QT_INSTALL_PLUGINS)"
          cd deploy/win64-mingw
          fail=0
          for f in $(find . -name '*.dll' | sort); do
            case "$f" in ./platforms/*|./imageformats/*) ref="$QT_PLUG/${f#./}";; *) ref="$QT_BIN/${f#./}";; esac
            a=$(sha256sum "$f" | cut -c1-64); b=$(sha256sum "$ref" | cut -c1-64)
            if [ "$a" = "$b" ]; then echo "same  $f"; else echo "::error::$f differs from $ref"; fail=1; fi
          done
          exit $fail

      - name: Build Ship (release, MinGW, no windeployqt)
        shell: cmd
        run: |
          mkdir build-mingw && cd build-mingw
          qmake ..\Ship.pro CONFIG+=release CONFIG+=no_windeployqt || exit /b 1
          mingw32-make -j4 || exit /b 1
          dir release\Ship.exe

      - name: Ship.exe imports
        shell: bash
        run: |
          objdump -p build-mingw/release/Ship.exe > imports.txt
          grep 'DLL Name' imports.txt
          echo "Symbols imported from Qt6Core5Compat.dll:"
          awk '/DLL Name: Qt6Core5Compat.dll/{f=1;next} /DLL Name:/{f=0} f && NF>=3 {print "  " $3}' imports.txt

      - name: Smoke e2e (Ship.exe --smoke with deploy/win64-mingw only)
        shell: pwsh
        run: .github/scripts/smoke-e2e.ps1 -Exe build-mingw\release\Ship.exe -Runtime deploy\win64-mingw -Work e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-e2e-logs
          path: |
            e2e/stderr.txt
            e2e/stdout.txt
          if-no-files-found: ignore

  linux-sanitizers:
    name: Linux / GCC ASan+UBSan(+LSan) unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dev libxkbcommon-dev

      - name: Build unit tests with sanitizers
        run: |
          mkdir build-asan && cd build-asan
          qmake ../Test/unit/unit.pro CONFIG+=debug \
            "QMAKE_CXXFLAGS+=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            "QMAKE_LFLAGS+=-fsanitize=address,undefined"
          make -j"$(nproc)"

      - name: Run unit tests (ASan + LSan + UBSan)
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/tst_parsers

      - name: Build C1-C3 tests with sanitizers (tst_critical)
        run: |
          mkdir build-critical && cd build-critical
          qmake ../Test/unit/critical/critical.pro CONFIG+=debug \
            "QMAKE_CXXFLAGS+=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            "QMAKE_LFLAGS+=-fsanitize=address,undefined"
          make -j"$(nproc)"

      - name: Run C1-C3 tests (ASan + UBSan, leaks off)
        env:
          QT_QPA_PLATFORM: offscreen
          # Leak detection is off: the app code under test leaks by design
          # (raw new without owners, M5 in the audit), not in this PR's scope.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-critical/tst_critical

      - name: Build GridMath tests with sanitizers (tst_gridmath)
        run: |
          mkdir build-gridmath && cd build-gridmath
          qmake ../Test/unit/gridmath/tst_gridmath.pro CONFIG+=debug \
            "QMAKE_CXXFLAGS+=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            "QMAKE_LFLAGS+=-fsanitize=address,undefined"
          make -j"$(nproc)"

      - name: Run GridMath tests (ASan + LSan + UBSan)
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-gridmath/tst_gridmath

      - name: Full app compiles on Linux (smoke)
        run: |
          mkdir build-app && cd build-app
          qmake ../Ship.pro CONFIG+=debug
          make -j"$(nproc)"
          test -x Ship

  lint:
    name: clang-format (changed lines) / cppcheck / clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format clang-tidy cppcheck \
            qt6-base-dev qt6-positioning-dev

      - name: clang-format on changed lines only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          echo "Diff base: $BASE"
          git diff -U0 --no-color "$BASE" HEAD -- '*.cpp' '*.h' > changes.diff
          clang-format-diff -p1 -style=file < changes.diff > format.diff || true
          if [ -s format.diff ]; then
            cat format.diff
            echo "::error::Changed lines are not clang-formatted (see diff above)"
            exit 1
          fi
          echo "clang-format: OK"

      - name: cppcheck (fails on error severity only)
        run: |
          cppcheck --version
          git ls-files '*.cpp' '*.h' > files.txt
          cppcheck -q --library=qt --std=c++17 --language=c++ --inline-suppr \
            --enable=warning,portability \
            --suppress=missingIncludeSystem --suppress=syntaxError \
            --suppress=preprocessorErrorDirective --suppress=unknownMacro \
            --template='{file}:{line}: {severity}: {message} [{id}]' \
            --file-list=files.txt 2> cppcheck.txt || true
          cat cppcheck.txt
          if grep -E ': error: ' cppcheck.txt; then
            echo "::error::cppcheck found errors"
            exit 1
          fi
          echo "::notice title=cppcheck::$(grep -c ': warning: ' cppcheck.txt || true) warnings (not blocking)"

      - name: clang-tidy (parsers + unit tests)
        run: |
          Q=$(qmake6 -query QT_INSTALL_HEADERS)
          clang-tidy --quiet \
            -checks='-*,bugprone-*,clang-analyzer-*,-bugprone-easily-swappable-parameters,-bugprone-narrowing-conversions,-bugprone-implicit-widening-of-multiplication-result' \
            -warnings-as-errors='clang-analyzer-*' \
            Parsers/nmeaparser.cpp Parsers/ppkparser.cpp -- \
            -std=c++17 -fPIC -IParsers -I"$Q" -I"$Q/QtCore" -I"$Q/QtGui" -I"$Q/QtWidgets" -I"$Q/QtPositioning"
